<style>
:root{--bg:#0f1117;--card:#181b23;--card2:#1f232d;--line:#2a2f3b;--txt:#e8eaf0;--mute:#8a91a3;--blue:#3b82f6;--red:#ef4444;--green:#22c55e;--gold:#eab308;--shadow:none}
body.claro{--bg:#f4f6fa;--card:#ffffff;--card2:#f0f2f7;--line:#dfe3ec;--txt:#161a23;--mute:#667085;--blue:#2563eb;--red:#dc2626;--green:#16a34a;--gold:#b7791f;--shadow:0 1px 3px rgba(0,0,0,.06)}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav.side{width:210px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;margin:0 6px 18px}

.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:0;background:none;color:var(--mute);cursor:pointer;text-align:left;font-size:15px}
.nb.on{background:var(--card2);color:var(--txt);font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:0 8px}
main{flex:1;min-width:0;padding:22px 26px 90px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.y{background:var(--gold)}
select,input[type=text],input[type=number],input[type=date],input[type=password],textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
.btn{text-decoration:none;color:var(--txt);display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.d{color:var(--red)}
.btn:disabled{opacity:.5}
.grid{display:grid;gap:14px}
.k6{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .r{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.kpi .l{color:var(--mute);font-size:12px}

.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:5px}
.cd{overflow:hidden}.sh{display:none}
.cal .h{font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px}
.cd{background:var(--card2);border-radius:8px;min-height:70px;padding:5px 7px;font-size:11px;display:flex;flex-direction:column;border:1px solid transparent}
.cd.x{opacity:.3}.cd.t{border-color:var(--blue)}

.cd .dv{margin-top:auto;font-weight:700;font-size:13px}
.cd .dp{font-size:10px;color:var(--mute)}
.cd.wk{background:none;border:1px dashed var(--line)}
.cd.pg{background:color-mix(in srgb,var(--blue) 14%,var(--card2))}

.msum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}

.seg{display:inline-flex;background:var(--card2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--mute);font-size:12px;font-weight:600}

.bar{height:16px;border-radius:4px;display:inline-block;vertical-align:middle}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.b-y{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.b-r{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}

.lic{display:grid;gap:10px}
.lc{display:grid;grid-template-columns:1.2fr 1fr .9fr .9fr 1fr 1fr;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--card2);cursor:pointer;border:1px solid transparent}
.lc.sel{border-color:var(--blue)}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)}.sw.on::after{left:23px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}

#login input{width:100%;text-align:center;font-size:20px;letter-spacing:6px;margin-bottom:8px}

.empty{color:var(--mute);text-align:center;padding:18px}
.filtros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.filtros select,.filtros input{width:100%;min-width:0}
.filtros select.on,.filtros input.on{border-color:var(--blue);color:var(--blue);font-weight:600}
.lctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 18px}
.lctl .g{display:grid;gap:5px}.lctl .g>span{font-size:12px;color:var(--mute)}
.lctl .seg{flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--mute);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
tr.sel td{background:color-mix(in srgb,var(--blue) 12%,transparent)}
tr.ck{cursor:pointer}
.nota{font-size:12px;color:var(--mute);margin-top:10px}
.cargando{opacity:.45;pointer-events:none;transition:opacity .2s}
nav.bot{display:none}
@media(max-width:820px){
 nav.side{display:none}
 main{padding:14px 12px 90px}
 nav.bot{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 nav.bot::-webkit-scrollbar{display:none}
 nav.bot .nb{flex:1 0 74px;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center;align-items:center;white-space:nowrap}
 nav.bot .nb i{font-style:normal;font-size:18px}
 .top h1{font-size:20px}
 .kpi .v{font-size:19px}
 .cal{gap:2px}.cd{min-height:50px;padding:3px}.cd .dv{font-size:10px;letter-spacing:-.3px}.cd .dp{display:none}.cd .dn{font-size:10px}
 .lg{display:none}.sh{display:inline}.mh{display:none}
 .msum{gap:10px}
 .lc{grid-template-columns:1fr 1fr}
 .k6{grid-template-columns:1fr 1fr}
 .filtros{grid-template-columns:1fr 1fr}
 select,input[type=text],input[type=number],input[type=date],input[type=password],textarea{font-size:16px}  /* evita el zoom de iPhone */
}
.btn.salir{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,var(--line));background:color-mix(in srgb,var(--red) 10%,var(--card));font-weight:700}
.btn.salir:hover{background:color-mix(in srgb,var(--red) 20%,var(--card))}
.gi{display:inline-block}
.gira .gi{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes dibuja{to{stroke-dashoffset:0}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes crece{from{transform:scaleY(0)}}
@keyframes ancho{from{width:0}}
.an .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja 1.1s ease-out forwards}
.an .fd{animation:aparece .9s .35s ease-out both}
.an .bb{transform-box:fill-box;animation:crece .6s ease-out both}
.an .bar{animation:ancho .7s ease-out}
.an .hm div:not(.lb){animation:aparece .6s ease-out both}
.cd.ck{cursor:pointer}.cd.ck:hover{border-color:var(--blue)}
.cfg-cur{border:2px solid var(--blue)}
.cfg-k{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pre{display:grid;gap:10px}
.prc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.prc .tx{flex:1;min-width:0}.prc .tx b{display:block;font-size:15px}.prc .tx span{display:block;font-size:12px;color:var(--mute)}
.ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.op{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.op.on{border:2px solid var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card));color:var(--blue)}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.stp .c{display:flex;align-items:center;gap:8px}
.stp .c button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.stp .c b{min-width:58px;text-align:center;font-size:17px}
.cb{font-size:11px;font-weight:700;color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent);border-radius:99px;padding:2px 8px;margin-left:6px}
.dif{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dif s{color:var(--mute)}.dif b{color:var(--blue)}
.aviso{background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
@media(prefers-reduced-motion:reduce){.an .dr,.an .fd,.an .bb,.an .bar,.an .hm div{animation:none!important;stroke-dasharray:none!important;stroke-dashoffset:0!important}.gira .gi{animation:none}}
</style>
</head>
<body>
<div id="login" class="card" style="display:none"></div>

<div class="app" id="app" style="display:none">
  <nav class="side" id="side"></nav>
  <main>
    <div class="top">
      <h1 id="titulo">Dashboard</h1>
      <select id="selCta" onchange="S.cta=this.value;guardar();pintar()"></select>
      <span class="pill" id="online"><span class="dot"></span>…</span>
      <button class="btn" id="bAct" onclick="actualizar()" title="Actualizar"><span class="gi">⟳</span></button>
      <button class="btn salir" onclick="pedirSalir()" title="Salir">⏻ Salir</button>
    </div>
    <div id="vista"></div>
  </main>
  <nav class="bot" id="bot"></nav>
</div>
<div id="modal"></div>
<div id="toast" class="toast" style="display:none"></div>

<script>
// ---------------------------------------------------------------- configuracion
const APP_VER = '2.6.0';
const API = 'https://qehuvzutrbqgppfifapp.supabase.co/functions/v1/web';
const VERS = {ESCALERA:'1.9.2', ESCANER:'1.9.2', FIBO:'0.6', REPORTE:'0.3'};   // ultimas versiones publicadas
const TABS = [['dash','Dashboard','◧'],['est','Estadísticas','▤'],['lab','Laboratorio','⚗'],['lic','Licencias','⚿'],['cfg','Configuración','☰'],['aj','Ajustes','⚙']];

// ---------------------------------------------------------------- estado
let D = null;                                 // datos del servidor
let ANIM = true;                              // animar los graficos (no en el refresco automatico)
let GIRO = 0;                                 // cargas en curso (el boton Actualizar gira)
const S = Object.assign({tab:'dash', tema:'oscuro', cta:'', mes:'', per:'30', graf:'linea', f:{}, selLic:-1}, leer());
if(!S.f || typeof S.f!=='object') S.f={};
// Laboratorio: por defecto la configuracion de la demo (FlipX M1-M4, EMA50, 5 entradas, AV2, TP 40)
const LAB_DEMO = {e:1, m:5, a:1, t:40, fam:'FlipX', ind:'', tfs:['M1','M2','M3','M4'], dir:'', desde:'', hasta:'', fuente:''};
S.lab = Object.assign(JSON.parse(JSON.stringify(LAB_DEMO)), {orden:'r', todas:false, riesgo:100}, (S.lab && typeof S.lab==='object') ? S.lab : {});
if(!Array.isArray(S.lab.tfs)) S.lab.tfs=[];
if(!(+S.lab.riesgo>0)) S.lab.riesgo=100;
function leer(){ try{ return JSON.parse(localStorage.getItem('zav')||'{}'); }catch(e){ return {}; } }
function guardar(){ try{ const o=Object.assign({},S); delete o.selLic; localStorage.setItem('zav',JSON.stringify(o)); }catch(e){} }
function tokG(){ try{ return localStorage.getItem('zavtok')||''; }catch(e){ return S._t||''; } }
function tokS(v){ S._t=v; try{ if(v) localStorage.setItem('zavtok',v); else localStorage.removeItem('zavtok'); }catch(e){} }
function marca(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

// ---------------------------------------------------------------- bloquear zoom (iPhone ignora user-scalable)
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
let ultToque=0; document.addEventListener('touchend', e=>{ const t=Date.now(); if(t-ultToque<300 && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); ultToque=t; }, {passive:false});

// ---------------------------------------------------------------- utilidades
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function $$(v,d=2){ if(v==null||isNaN(v)) return '—'; const a=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return (v<0?'-$':'$')+a; }
function sg(v,d=2){ return (v>0?'+':'')+$$(v,d); }
const cl = v => v>0?'pos':(v<0?'neg':'');
const pct = (a,b) => b ? (a/b*100) : 0;
function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',2600); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pd(s){ const m=String(s).match(/(\d{4})-(\d\d)-(\d\d)(?: (\d\d):(\d\d))?/); return m? new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)) : null; }
function lunes(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function tfMin(t){ const m=/^([MHDW])(\d*)$/.exec(t||''); if(!m) return 1e9; const k=+m[2]||1; return m[1]==='M'?k:m[1]==='H'?k*60:m[1]==='D'?1440*k:10080; }

function tema(){
  let t=S.tema; if(t==='sistema') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro':'oscuro';
  document.body.classList.toggle('claro', t==='claro');
  document.querySelector('meta[name=theme-color]').content = t==='claro' ? '#f4f6fa' : '#0f1117';
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', tema);

function devId(){
  try{ let d=localStorage.getItem('zavdev'); if(!d){ d=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9-]/g,''); localStorage.setItem('zavdev',d); } return d; }catch(e){ return ''; }
}
const MODO = (matchMedia('(display-mode: standalone)').matches || navigator.standalone) ? 'app' : 'web';
async function api(a, o){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({a, t:tokG(), dev:devId(), modo:MODO}, o||{}))});
  let j; try{ j = await r.json(); }catch(e){ throw 'respuesta inválida ('+r.status+')'; }
  if(j && j.sesion===false){ tokS(''); D=null; verLogin('Tu sesión se cerró (venció, saliste o se cambió el PIN). Entra otra vez.'); throw 'sesión'; }
  return j;
}

// ---------------------------------------------------------------- huella / rostro (WebAuthn)
const b64u = {
  dec: s => { s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s), c=>c.charCodeAt(0)).buffer; },
  enc: b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')
};
const pkSoporta = () => !!(window.PublicKeyCredential && navigator.credentials);
async function pkCrear(op){
  const pk = Object.assign({}, op, {challenge:b64u.dec(op.challenge), user:Object.assign({}, op.user, {id:b64u.dec(op.user.id)}),
    excludeCredentials:(op.excludeCredentials||[]).map(c=>Object.assign({}, c, {id:b64u.dec(c.id)}))});
  const c = await navigator.credentials.create({publicKey:pk});
  return {id:c.id, rawId:b64u.enc(c.rawId), type:c.type, authenticatorAttachment:c.authenticatorAttachment||undefined,
    clientExtensionResults:c.getClientExtensionResults(),
    response:{clientDataJSON:b64u.enc(c.response.clientDataJSON), attestationObject:b64u.enc(c.response.attestationObject),
              transports:c.response.getTransports?c.response.getTransports():[]}};
}
async function pkUsar(op){
  const pk = Object.assign({}, op, {challenge:b64u.dec(op.challenge), allowCredentials:(op.allowCredentials||[]).map(c=>Object.assign({}, c, {id:b64u.dec(c.id)}))});
  const c = await navigator.credentials.get({publicKey:pk});
  return {id:c.id, rawId:b64u.enc(c.rawId), type:c.type, authenticatorAttachment:c.authenticatorAttachment||undefined,
    clientExtensionResults:c.getClientExtensionResults(),

function limiteDe(cuenta){ const L=D.ajustes.limites||{}; return (cuenta in L) ? L[cuenta] : D.ajustes.limite; }

function calendario(E,c){
  const hoy = pd(D.ahora);
  if(!S.mes) S.mes = D.ahora.slice(0,7);
  const [y,m] = S.mes.split('-').map(Number);
  const d1 = new Date(y,m-1,1), dN = new Date(y,m,0);
  const dia = {}; E.forEach(e=>{ const k=e[12]; dia[k]=dia[k]||{r:0,n:0}; dia[k].r+=e[10]; dia[k].n++; });
  const after = k => E.reduce((s,e)=>s+(e[12]>=k?e[10]:0),0);
  let mt=0,mg=0,mp=0,mn=0; Object.keys(dia).forEach(k=>{ if(k.slice(0,7)===S.mes){ mt+=dia[k].r; mn+=dia[k].n; if(dia[k].r>0)mg++; else if(dia[k].r<0)mp++; } });
  const balIni = c.balance - after(S.mes+'-01');
  let h = `<h3>Calendario <span class="r"><button class="btn" onclick="mover(-1)">‹</button><b style="min-width:120px;text-align:center">${MESES[m-1]} ${y}</b><button class="btn" onclick="mover(1)">›</button></span></h3>
    <div class="msum"><span>Mes: <b class="${cl(mt)}">${sg(mt)}</b> <span class="mute">(${pct(mt,balIni).toFixed(2)}%)</span></span><span>Escaleras: <b>${mn}</b></span><span>Días ganadores: <b class="pos">${mg}</b></span><span>Días perdedores: <b class="neg">${mp}</b></span></div>
    <div class="cal">` + ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom','Semana'].map(x=>`<div class="h">${x}</div>`).join('');
  let d = lunes(d1);

    let ws=0, wn=0;

      const k=ymd(d), x=dia[k], fuera=d.getMonth()!==m-1;
      if(x && !fuera){ ws+=x.r; wn+=x.n; }
      const p = x ? pct(x.r, c.balance - after(k) + 0) : 0;
      h += `<div class="cd ${fuera?'x':''} ${k===ymd(hoy)?'t':''} ${x&&!fuera?(x.r>=0?'pg':'ng')+' ck':''}" ${x&&!fuera?`onclick="verDia('${k}')"`:''}><span class="dn">${d.getDate()}${x?' · '+x.n:''}</span>` +
           (x&&!fuera ? `<span class="dv ${cl(x.r)}"><span class="lg">${sg(x.r)}</span><span class="sh">${sg(x.r,0)}</span></span><span class="dp">${p.toFixed(2)}%</span>` : '') + `</div>`;
      d.setDate(d.getDate()+1);

    h += `<div class="cd wk"><span class="dn">${wn?wn+'<span class="lg"> esc.</span>':''}</span>${wn?`<span class="dv ${cl(ws)}"><span class="lg">${sg(ws)}</span><span class="sh">${sg(ws,0)}</span></span>`:''}</div>`;
  }
  return h + `</div>`;

const DDN = {a:'DD menor a $20', b:'DD $20 – $40', c:'DD $40 – $60', d:'DD más de $60', x:'Sin DD medido'};
const BLQ = ['Madrugada (00–06 h)','Mañana (06–12 h)','Tarde (12–18 h)','Noche (18–24 h)'];
function ddB(e){ if(e[11]==null) return 'x'; const d=-e[11]; return d<20?'a':d<40?'b':d<60?'c':'d'; }
function horaDe(e){ const d=pd(e[8]); return d?d.getHours():-1; }
const FIL = {
  ind:  {t:'Todos los índices',     k:e=>e[2],       n:v=>v},
  tf:   {t:'Todas las TF',          k:e=>e[3]||'Sin TF',  n:v=>v, o:(a,b)=>tfMin(a)-tfMin(b)},
  ent:  {t:'Todas las entradas',    k:e=>String(e[5]), n:v=>v+' entrada'+(v==='1'?'':'s'), o:(a,b)=>a-b},
  dd:   {t:'Todo el DD',            k:ddB,           n:v=>DDN[v]},
  dir:  {t:'Compra y venta',        k:e=>e[4],       n:v=>v==='COMPRA'?'▲ Compra':'▼ Venta'},
  hora: {t:'Toda hora de cierre'}
};
function pasaHora(e,v){ const h=horaDe(e); if(v[0]==='b') return Math.floor(h/6)===+v.slice(1); return h===+v.slice(1); }
function filtrar(sinFiltro){
  let E = escs();
  const hoy = pd(D.ahora);
  if(S.per==='7'||S.per==='30'){ const d=new Date(hoy); d.setDate(d.getDate()-(+S.per)+1); const k=ymd(d); E=E.filter(e=>e[12]>=k); }
  else if(S.per==='mes'){ const k=D.ahora.slice(0,7); E=E.filter(e=>e[12].slice(0,7)===k); }
  Object.keys(FIL).forEach(f=>{ const v=S.f[f]; if(!v || f===sinFiltro) return;
    E = f==='hora' ? E.filter(e=>pasaHora(e,v)) : E.filter(e=>FIL[f].k(e)===v); });
  return E.sort((a,b)=>a[8]<b[8]?-1:1);
}
function seg(id,opts,val,fn){ return `<span class="seg">`+opts.map(([v,t])=>`<button class="${val===v?'on':''}" onclick="${fn}('${v}')">${t}</button>`).join('')+`</span>`; }
function setPer(v){ S.per=v; guardar(); pintar(); }
function setGraf(v){ S.graf=v; guardar(); pintar(); }
function setF(f,v){ if(v) S.f[f]=v; else delete S.f[f]; guardar(); pintar(); }
function limpiarF(){ S.f={}; guardar(); pintar(); }
function selFiltro(f){
  const v=S.f[f]||'';
  let op;
  if(f==='hora'){
    op = `<optgroup label="Bloques">${BLQ.map((t,i)=>`<option value="b${i}" ${v==='b'+i?'selected':''}>${t}</option>`).join('')}</optgroup>` +
         `<optgroup label="Por hora">${Array.from({length:24},(x,i)=>`<option value="h${i}" ${v==='h'+i?'selected':''}>${String(i).padStart(2,'0')}:00 – ${String(i).padStart(2,'0')}:59</option>`).join('')}</optgroup>`;
  } else {
    const F=FIL[f]; const base=filtrar(f);   // opciones posibles con los demas filtros puestos
    let ks=[...new Set(base.map(F.k))]; if(v && ks.indexOf(v)<0) ks.push(v);
    ks.sort(F.o||undefined);
    op = ks.map(k=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(F.n(k))}</option>`).join('');
  }
  return `<select class="${v?'on':''}" onchange="setF('${f}',this.value)"><option value="">${FIL[f].t}</option>${op}</select>`;
}

function vEst(){
  const E = filtrar();
  const nf = Object.keys(S.f).length;
  let h = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
     ${seg('per',[['7','7 días'],['30','30 días'],['mes','Este mes'],['todo','Todo']],S.per,'setPer')}
     ${nf?`<button class="btn" onclick="limpiarF()">Quitar filtros (${nf})</button>`:''}</div>
     <div class="filtros">${Object.keys(FIL).map(selFiltro).join('')}</div>`;
  if(!E.length){ $('vista').innerHTML = h+'<div class="card empty">No hay escaleras con estos filtros.</div>'; return; }
  const g=E.filter(e=>e[10]>0), p=E.filter(e=>e[10]<=0);
  const tot=E.reduce((s,e)=>s+e[10],0), sg_=g.reduce((s,e)=>s+e[10],0), sp=p.reduce((s,e)=>s+e[10],0);
  const dds=E.filter(e=>e[11]!=null);
  const ddm = dds.length ? dds.reduce((s,e)=>s+e[11],0)/dds.length : null;
  const mx = E.reduce((a,e)=>e[10]>a[10]?e:a,E[0]), mn = E.reduce((a,e)=>e[10]<a[10]?e:a,E[0]);
  h += `<div class="grid k6">
    ${kpi('Resultado', sg(tot), cl(tot), E.length+' escaleras')}
    ${kpi('Ganadas', pct(g.length,E.length).toFixed(0)+'%', '', g.length+' de '+E.length)}

  </div>`;
  h += `<div class="card" style="margin-top:14px"><h3>Resultado <span class="r">${seg('g',[['linea','Línea'],['area','Área'],['barras','Barras diarias']],S.graf,'setGraf')}</span></h3>${grafico(E)}</div>`;

function ddOrd(t){ return ['a','b','c','d','x'].indexOf(Object.keys(DDN).find(k=>DDN[k]===t)); }
function tabla(E,key,orden){
  const G={}; E.forEach(e=>{ const k=key(e); G[k]=G[k]||{n:0,g:0,r:0,dd:0,nd:0}; const x=G[k]; x.n++; if(e[10]>0)x.g++; x.r+=e[10]; if(e[11]!=null){x.dd+=e[11];x.nd++;} });
  let ks = Object.keys(G); ks.sort(orden||((a,b)=>G[b].r-G[a].r));
  const max = Math.max(...ks.map(k=>Math.abs(G[k].r)),1);
  return `<div class="tw"><table><tr><th></th><th class="n">Esc.</th><th class="n">Ganadas</th><th class="n">DD medio</th><th class="n">Resultado</th><th style="width:30%"></th></tr>` +
    ks.map(k=>{ const x=G[k]; return `<tr><td>${esc(k)}</td><td class="n">${x.n}</td><td class="n">${pct(x.g,x.n).toFixed(0)}%</td><td class="n neg">${x.nd?$$(x.dd/x.nd):'—'}</td>
      <td class="n ${cl(x.r)}"><b>${sg(x.r)}</b></td><td><span class="bar" style="width:${Math.abs(x.r)/max*100}%;background:var(${x.r>=0?'--blue':'--red'})"></span></td></tr>`; }).join('') + `</table></div>`;
}
function mapa(E){
  const M={}; E.forEach(e=>{ const d=pd(e[8]); if(!d)return; const k=((d.getDay()+6)%7)+'_'+Math.floor(d.getHours()/2); M[k]=(M[k]||0)+e[10]; });
  const mx=Math.max(...Object.values(M).map(Math.abs),1);
  let h=`<div class="hm"><div></div>`+['L','M','X','J','V','S','D'].map(x=>`<div class="lb" style="justify-content:center">${x}</div>`).join('');
  for(let b=0;b<12;b++){ h+=`<div class="lb">${String(b*2).padStart(2,'0')}h</div>`;
    for(let w=0;w<7;w++){ const v=M[w+'_'+b]; const a=v?0.15+0.75*Math.abs(v)/mx:0;
      h+=`<div title="${v?sg(v):''}" style="background:${v?`color-mix(in srgb,var(${v>=0?'--blue':'--red'}) ${Math.round(a*100)}%,transparent)`:'var(--card2)'}"></div>`; } }
  return h+`</div>`;
}
function grafico(E){
  const W=900,H=240,P=46;
  let pts;
  if(S.graf==='barras'){
    const d={}; E.forEach(e=>d[e[12]]=(d[e[12]]||0)+e[10]); pts=Object.keys(d).sort().map(k=>[k,d[k]]);
  } else { let s=0; pts=E.map(e=>[e[8],s+=e[10]]); pts.unshift([E[0][7],0]); }
  const vs=pts.map(p=>p[1]); const mx=Math.max(0,...vs), mn=Math.min(0,...vs), rg=(mx-mn)||1;
  const Y=v=>10+(mx-v)/rg*(H-30), n=pts.length;
  const X=i=>P+(n<=1?0:i*(W-P-10)/(n-1));
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  [mx,(mx+mn)/2,mn].forEach(v=>{ g+=`<line x1="${P}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${v===0?'':'3 4'}"/><text x="${P-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${$$(v,0)}</text>`; });
  g+=`<line x1="${P}" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-width="1"/>`;
  if(S.graf==='barras'){
    const bw=Math.max(3,Math.min(28,(W-P-10)/n*0.7));
    pts.forEach((p,i)=>{ const x=P+(i+0.5)*(W-P-10)/n-bw/2, y=Math.min(Y(p[1]),Y(0)), h=Math.max(1,Math.abs(Y(p[1])-Y(0)));
      g+=`<rect class="bb" style="transform-origin:50% ${p[1]>=0?'100%':'0%'};animation-delay:${Math.min(i*15,600)}ms" x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="var(${p[1]>=0?'--blue':'--red'})"><title>${p[0]}: ${sg(p[1])}</title></rect>`; });
    const lb=[0,Math.floor(n/2),n-1].filter((v,i,a)=>a.indexOf(v)===i);
    lb.forEach(i=>g+=`<text x="${P+(i+0.5)*(W-P-10)/n}" y="${H-2}" text-anchor="middle" font-size="11" fill="var(--mute)">${pts[i][0].slice(5)}</text>`);
  } else {
    const line = pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    const last = vs[vs.length-1], col = last>=0?'--blue':'--red';
    if(S.graf==='area') g+=`<path class="fd" d="${line} L${X(n-1)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="var(${col})" opacity=".18"/>`;
    g+=`<path class="dr" pathLength="1" d="${line}" fill="none" stroke="var(${col})" stroke-width="2.2" stroke-linejoin="round"/>`;
    g+=`<circle class="fd" cx="${X(n-1)}" cy="${Y(last)}" r="4" fill="var(${col})"/>`;
    g+=`<text x="${P}" y="${H-2}" font-size="11" fill="var(--mute)">${esc(String(pts[0][0]).slice(5,10))}</text><text x="${W-10}" y="${H-2}" text-anchor="end" font-size="11" fill="var(--mute)">${esc(String(pts[n-1][0]).slice(5,10))} · ${sg(last)}</text>`;
  }
  return g+`</svg>`;
}

let LB = null, LOP = null, LCARGA = '';                 // ultimo resumen, opciones de filtros, clave en curso

function labTf(tf){ const a=S.lab.tfs, i=a.indexOf(tf); if(tf==='') S.lab.tfs=[]; else if(i>=0) a.splice(i,1); else a.push(tf); guardar(); pintar(); }

async function labCargar(){

// riesgo: el servidor calcula todo con $100; aqui se escalan los dolares (lineal, sin redondeo de lotes)
const L_ESC = new Set(['r','ra','rb','dd','dp','ddp','gan','per','peor','mejor','res']);
function labEsc(R,f){
  if(f===1) return R;
  const sc = o => { if(Array.isArray(o)) return o.map(sc);
    if(o && typeof o==='object'){ const q={}; for(const k in o) q[k] = (L_ESC.has(k) && typeof o[k]==='number') ? Math.round(o[k]*f*100)/100 : sc(o[k]); return q; }
    return o; };
  const Q = sc(R);
  Q.dia = (R.dia||[]).map(d=>[d[0], d[1]*f]);
  Q.ult = (R.ult||[]).map(u=>{ const v=u.slice(); if(v[5]!=null) v[5]*=f; if(v[6]!=null) v[6]*=f; return v; });
  return Q;
}

function labN(k,v){ S.lab[k] = (k==='orden') ? v : +v; guardar(); pintar(); }
function durTxt(m){ if(m==null) return '—'; m=+m; return m<60 ? m+' min' : (m/60).toFixed(m<600?1:0)+' h'; }
function labComp(R){

function labTabla(rows,nom,orden){

      <td class="n ${cl(r.r)}"><b>${sg(r.r)}</b></td><td class="mh"><span class="bar" style="width:${Math.abs(r.r)/max*100}%;background:var(${r.r>=0?'--blue':'--red'})"></span></td></tr>`).join('') + `</table></div>`;

function labRanking(R){
  const x = S.lab, C = (R.combos||[]).slice();
  const v = c => x.orden==='ef' ? c.g/c.n + c.r/1e7 : x.orden==='pe' ? c.r/c.n : c.r;
  C.sort((a,b)=>v(b)-v(a));
  if(!C.length) return '<div class="empty">Sin datos</div>';

function labCurva(dia){
  if(!dia||!dia.length) return '<div class="empty">Sin datos</div>';
  let s=0; const pts=[['',0]].concat(dia.map(d=>[d[0], s+=d[1]]));
  const W=600,H=220,P=50, vs=pts.map(p=>p[1]), mx=Math.max(0,...vs), mn=Math.min(0,...vs), rg=(mx-mn)||1, n=pts.length;
  const Y=v=>10+(mx-v)/rg*(H-30), X=i=>P+(n<=1?0:i*(W-P-10)/(n-1));
  const last=vs[n-1], col=last>=0?'--blue':'--red';
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  [mx,(mx+mn)/2,mn].forEach(v=>{ g+=`<line x1="${P}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${P-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${$$(v,0)}</text>`; });
  g+=`<line x1="${P}" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)"/>`;
  const iB = pts.findIndex(p=>p[0]>='2026-10-16');      // inicio de la mitad B
  if(iB>0) g+=`<line x1="${X(iB)}" x2="${X(iB)}" y1="10" y2="${H-20}" stroke="var(--mute)" stroke-dasharray="2 3"/><text x="${X(iB)+4}" y="20" font-size="11" fill="var(--mute)">B</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  g+=`<path class="fd" d="${line} L${X(n-1)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="var(${col})" opacity=".15"/><path class="dr" pathLength="1" d="${line}" fill="none" stroke="var(${col})" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<circle class="fd" cx="${X(n-1)}" cy="${Y(last)}" r="4" fill="var(${col})"/>`;
  g+=`<text x="${P}" y="${H-2}" font-size="11" fill="var(--mute)">${esc(pts[1][0].slice(5))}</text><text x="${W-10}" y="${H-2}" text-anchor="end" font-size="11" fill="var(--mute)">${esc(pts[n-1][0].slice(5))} · ${sg(last)}</text>`;
  return g+`</svg>`;
}

function riesgoTx(r, bal){
  if(r.capital) return `<b>capital total ${(+r.pct).toFixed(0)}%</b>${bal!=null?` = ${$$(bal*r.pct/100)}`:''}`;
  return `<b>monto fijo ${$$(+r.fijo)}</b> · Capital total: apagado`;
}
function resumenPre(p){ return `${ENT_TX[p.ent]} · ${p.maxN} entradas · ${slTx(p.sl)} · TP ${(+p.tp).toFixed(0)}%`; }
function mismoPerfil(a,b){ return a.ent===b.ent && a.maxN===b.maxN && Math.abs(a.sl-b.sl)<1e-6 && Math.abs(a.tp-b.tp)<1e-6 && a.minN===b.minN && a.et===b.et && !!a.dd===!!b.dd; }
function idxFam(D2, fam){ const i=D2.perfiles.findIndex(p=>p.on && p.fam && p.fam.toLowerCase()===fam.toLowerCase()); return i>=0?i:0; }

function vCfg(){

    <div style="margin-top:12px;font-size:14px">Riesgo por escalera: ${riesgoTx(base.riesgo, c.balance)}</div>

function cfgSetCta(k){ S.cfgCta=k; guardar(); CV='inicio'; CE=null; vCfg(); }
function cfgEditar(pre){

function cfgUsar(id){

}
function cfgVolver(){ CV='inicio'; CE=null; vCfg(); window.scrollTo(0,0); }
function cb(a,b){ return JSON.stringify(a)!==JSON.stringify(b) ? '<span class="cb">cambió</span>' : ''; }
function stp(lbl, val, fnm, fnp){ return `<div class="stp"><span>${lbl}</span><span class="c"><button aria-label="Bajar ${lbl}" onclick="${fnm}">−</button><b>${val}</b><button aria-label="Subir ${lbl}" onclick="${fnp}">+</button></span></div>`; }

  <div class="card"><h3>Stop loss (SL) ${cb(p.sl,q.sl)}</h3><div class="ops">${SL_OP.map(([v,t])=>`<button class="op ${Math.abs(p.sl-v)<1e-6?'on':''}" onclick="cfgP('sl',${v})">${t}</button>`).join('')}</div></div>
  <div class="card"><h3>Take profit y entradas ${cb([p.tp,p.maxN,p.minN],[q.tp,q.maxN,q.minN])}</h3>
    ${stp('TP (% del Fibo)', (+p.tp).toFixed(0)+'%', "cfgN('tp',-1,1,99)", "cfgN('tp',1,1,99)")}
    ${stp('Entradas máximas', p.maxN, "cfgN('maxN',-1,1,40)", "cfgN('maxN',1,1,40)")}
    ${stp('Entradas mínimas', p.minN, "cfgN('minN',-1,1,"+p.maxN+")", "cfgN('minN',1,1,"+p.maxN+")")}
  </div>
  <div class="card"><h3>Temporalidades ${cb(p.tfs,q.tfs)}</h3><div class="ops">${TF_OP.map(t=>`<button class="op ${tfs.includes(t)?'on':''}" onclick="cfgTf('${t}')">${t}</button>`).join('')}</div></div>
  <div class="card"><h3>Every Trade (ET) ${cb([p.et,p.dd,p.ddFrom,p.ddX],[q.et,q.dd,q.ddFrom,q.ddX])}</h3>
    <div class="ops">${[1,2,0].map(v=>`<button class="op ${p.et===v?'on':''}" onclick="cfgP('et',${v})">${ET_TX[v]}</button>`).join('')}</div>
    <div class="row"><div class="tx"><b>TP según el peor DD</b><span>Desde un peor DD de ${$$(p.ddFrom)} cierra en ${p.ddX}× ese DD.</span></div><button class="sw ${p.dd?'on':''}" onclick="cfgP('dd',${!p.dd})"></button></div>
    ${p.dd?stp('Desde peor DD de', $$(p.ddFrom,0), "cfgN('ddFrom',-5,0,1000)", "cfgN('ddFrom',5,0,1000)")+stp('Cierra en × peor DD', (+p.ddX).toFixed(2), "cfgN('ddX',-0.05,0.05,5)", "cfgN('ddX',0.05,0.05,5)"):''}
  </div>
  <div class="card"><h3>Riesgo por escalera ${cb(r,rb)} <span class="r mute" style="font-size:12px">vale para toda la cuenta</span></h3>

    ${stp('% del balance', (+r.pct).toFixed(0)+'%', "cfgRN('pct',-5,1,100)", "cfgRN('pct',5,1,100)")}
    ${stp('Monto fijo', $$(+r.fijo,0), "cfgRN('fijo',-5,5,100000)", "cfgRN('fijo',5,5,100000)")}
    <div class="aviso" style="background:color-mix(in srgb,var(--blue) 12%,transparent)">${r.capital?`Con balance ${$$(c.balance)} la próxima escalera arriesgaría <b>${$$(c.balance*r.pct/100)}</b>. Si apagas el interruptor vuelve a <b>${$$(+r.fijo)}</b> fijos.`:`La próxima escalera arriesgaría <b>${$$(+r.fijo)}</b>.`}</div>

    <button class="btn p" style="width:100%;padding:12px;font-size:15px" onclick="cfgRevisar()">Revisar cambios</button>

  </div></div>`;
}
function cfgP(k,v){ CE.perfiles[CP][k]=v; vCfg(); }
function cfgN(k,d,a,b){ const p=CE.perfiles[CP]; p[k]=Math.round(Math.min(b,Math.max(a,(+p[k])+d))*100)/100; if(k==='maxN'&&p.minN>p.maxN) p.minN=p.maxN; vCfg(); }
function cfgR(k,v){ CE.riesgo[k]=v; vCfg(); }
function cfgRN(k,d,a,b){ const r=CE.riesgo; r[k]=Math.min(b,Math.max(a,(+r[k])+d)); vCfg(); }
function cfgTf(t){ const p=CE.perfiles[CP]; let L=p.tfs.split(',').filter(x=>x); L=L.includes(t)?L.filter(x=>x!==t):L.concat(t); if(!L.length) return toast('Deja al menos una temporalidad'); p.tfs=TF_OP.filter(x=>L.includes(x)).concat(L.filter(x=>!TF_OP.includes(x))).join(','); vCfg(); }
function cfgDifs(){
  const out=[], r=CE.riesgo, rb=CB.riesgo;
  CE.perfiles.forEach((p,i)=>{ const q=CB.perfiles[i]; if(!p.fam) return; const f=p.fam+' · ';
    if(p.on!==q.on) out.push([f+'Activo', q.on?'sí':'no', p.on?'sí':'no']);
    if(p.ent!==q.ent) out.push([f+'Entrada', ENT_TX[q.ent], ENT_TX[p.ent]]);
    if(Math.abs(p.sl-q.sl)>1e-6) out.push([f+'SL', slTx(q.sl), slTx(p.sl)]);
    if(p.tp!==q.tp) out.push([f+'TP', q.tp+'%', p.tp+'%']);
    if(p.maxN!==q.maxN) out.push([f+'Entradas máx.', q.maxN, p.maxN]);
    if(p.minN!==q.minN) out.push([f+'Entradas mín.', q.minN, p.minN]);
    if(p.tfs!==q.tfs) out.push([f+'Temporalidades', q.tfs, p.tfs]);
    if(p.et!==q.et) out.push([f+'ET', ET_TX[q.et], ET_TX[p.et]]);
    if(!!p.dd!==!!q.dd || p.ddFrom!==q.ddFrom || p.ddX!==q.ddX) out.push([f+'TP x DD', q.dd?`${$$(q.ddFrom,0)} · ${q.ddX}×`:'no', p.dd?`${$$(p.ddFrom,0)} · ${p.ddX}×`:'no']);
  });
  if(r.capital!==rb.capital) out.push(['Capital total', rb.capital?'activado':'apagado', r.capital?'activado':'apagado']);
  if(r.pct!==rb.pct) out.push(['% del balance', (+rb.pct).toFixed(0)+'%', (+r.pct).toFixed(0)+'%']);
  if(r.fijo!==rb.fijo) out.push(['Monto fijo', $$(+rb.fijo), $$(+r.fijo)]);
  return out;
}

  try{
    const r=await api('config_guardar',{cuentas, datos:CE, nombre:CNOM});

async function guardarInv(i){

  if(!nombre) return err('Falta el nombre');

    const r = await api(i>=0?'invitado_editar':'invitado_nuevo', {id:i>=0?D.invitados[i].id:undefined, nombre, pin, vence});

function formPin(){
  modal(`<h3>Cambiar PIN</h3>
    <div class="fld"><label>PIN actual</label><input type="password" id="pa" inputmode="numeric"></div>
    <div class="fld"><label>PIN nuevo (4 a 8 números)</label><input type="password" id="pn" inputmode="numeric"></div>
    <div class="fld"><label>Repite el PIN nuevo</label><input type="password" id="pr" inputmode="numeric"></div>
    <p id="perr" class="neg" style="min-height:18px;margin:0"></p>
    <div class="acts"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn p" onclick="cambiarPin()">Guardar</button></div>`);
}
async function cambiarPin(){
  const pn=$('pn').value.trim();
  if(!/^\d{4,8}$/.test(pn)) return $('perr').textContent='El PIN debe tener de 4 a 8 números';
  if(pn!==$('pr').value.trim()) return $('perr').textContent='Los dos PIN nuevos no coinciden';
  try{ const r=await api('cambiar_pin',{actual:$('pa').value.trim(), nuevo:pn}); if(!r.ok) return $('perr').textContent=r.msg; cerrar(); toast(r.cerradas?`PIN cambiado. Se cerraron ${r.cerradas} sesión(es) en otros dispositivos.`:'PIN cambiado'); cargar(); }
  catch(e){ $('perr').textContent='Error: '+e; }
}

function bajarCsv(nombre, cab, filas){
  const q=x=>x==null?'':(/[,"\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x);
  const t=[cab.join(',')].concat(filas.map(f=>f.map(q).join(','))).join('\n');
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'})); a.download=nombre+'_'+D.ahora.slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); toast('CSV descargado');
  }catch(e){ pedirCopia(t); }
}
function csvEsc(){ bajarCsv('escaleras',['Cuenta','Id','Indice','TF','Direccion','Entradas','Lotes','Abre','Cierra','Minutos','Resultado','PeorDD','Fecha'], filtrar()); }
